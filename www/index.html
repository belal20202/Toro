<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>خالد</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/extra.css"></head><body>
<header><div id="who"></div><div class="logo">📖 خالد</div><small>⏳ باقي على الامتحانات التمهيدية</small><div id="cd"></div></header>
<main id="view"></main>
<div id="toast"></div><div id="ring"></div><div id="login"></div><div id="sheet"></div>
<div id="reader" class="mode-sepia">
 <div id="rprog"></div>
 <div id="rsc" onclick="toggleBars()"><div id="pg"></div></div>
 <div id="rtop"><button class="rb" onclick="closeBook()">✕</button><span id="rtitle"></span><span id="rpg"></span></div>
 <div id="rbar"><input id="rsl" type="range" min="1" max="1" value="1" onchange="goPage(this.value)">
  <div class="rbtns"><button class="rb" onclick="zoomBy(.85)">➖</button><button class="rb" onclick="zoomBy(1)">↔</button><button class="rb" onclick="zoomBy(1.2)">➕</button><button class="rb" id="rmode" onclick="cycleRMode()">📜</button><button class="rb" id="rbm" onclick="toggleBm()">⭐</button><button class="rb" onclick="openSheet()">📝</button></div></div>
</div>
<nav>
<button data-t="home" onclick="go('home')"><span>🏠</span>الرئيسية</button>
<button data-t="alarm" onclick="go('alarm')"><span>⏰</span>المنبه</button>
<button data-t="chat" onclick="go('chat')"><span>🤖</span>المساعد<b id="bd"></b></button>
<button data-t="focus" onclick="go('focus')"><span>🎯</span>تركيز</button>
<button data-t="more" onclick="go('more')"><span>☰</span>المزيد</button>
</nav>
<script src="lib/pdf.min.js"></script>
<script src="js/data.js"></script><script src="js/app.js"></script><script src="js/alarm.js"></script><script src="js/tools.js"></script><script src="js/ai.js"></script>
<script src="js/vision.js"></script><script src="js/user.js"></script><script src="js/notify.js"></script><script src="js/reader.js"></script><script src="js/main.js"></script>
</body></html>
