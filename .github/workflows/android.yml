name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: App icon
        continue-on-error: true
        run: npx @capacitor/assets generate --android
      - name: Add permissions
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          perms=['POST_NOTIFICATIONS','SCHEDULE_EXACT_ALARM','USE_EXACT_ALARM','VIBRATE','WAKE_LOCK','CAMERA','RECEIVE_BOOT_COMPLETED','USE_FULL_SCREEN_INTENT','INTERNET']
          add=''.join('    <uses-permission android:name="android.permission.%s" />\n'%x for x in perms if ('permission.%s"'%x) not in s)
          s=s.replace('</manifest>',add+'</manifest>')
          open(p,'w',encoding='utf-8').write(s)
          PY
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Toro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
