name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Add permissions
        run: |
          P=""
          for x in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM RECORD_AUDIO CAMERA VIBRATE WAKE_LOCK; do P="$P<uses-permission android:name=\"android.permission.$x\"/>"; done
          sed -i "s#<application#$P<application#" android/app/src/main/AndroidManifest.xml
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: study-alarm-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
